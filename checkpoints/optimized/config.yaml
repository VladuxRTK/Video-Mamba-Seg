advanced:
  label_smoothing: 0.1
  mixup_alpha: 0.2
  warmup_epochs: 5
dataset:
  augmentation:
    brightness: 0.3
    contrast: 0.3
    hue: 0.15
    p_flip: 0.5
    rotation_range:
    - -15
    - 15
    saturation: 0.3
    scale_range:
    - 0.7
    - 1.3
  batch_size: 1
  img_size:
  - 320
  - 480
  num_workers: 4
  sequence_length: 4
  sequence_stride: 2
evaluation:
  enabled: true
  metrics:
  - iou
  - f1
  - precision
  - recall
flow:
  enabled: false
losses:
  boundary_weight: 1.0
  ce_weight: 0.3
  dice_weight: 2.5
  temporal_weight: 0.5
memory:
  clear_cache_every: 50
model:
  d_conv: 4
  d_state: 32
  dropout: 0.15
  expand: 2
  hidden_dims:
  - 32
  - 64
  - 128
  - 256
  input_dim: 3
  temporal_window: 4
optimizer:
  betas:
  - 0.9
  - 0.999
  lr: 0.0002
  type: AdamW
  weight_decay: 0.01
paths:
  checkpoints: checkpoints/optimized
  davis_root: /mnt/c/Datasets/DAVIS
  logs: logs/optimized
  visualizations: visualizations/optimized
scheduler:
  min_lr: 5e-6
  type: onecycle
training:
  epochs: 150
  grad_clip_value: 1.0
  gradient_accumulation_steps: 8
  mixed_precision: true
  patience: 25
  save_every: 10
  validate_every: 2
visualization:
  dir: visualizations/optimized
  enabled: true
  interval: 5
