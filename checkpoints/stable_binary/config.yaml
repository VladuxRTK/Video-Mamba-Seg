dataset:
  augmentation:
    brightness: 0.1
    contrast: 0.1
    hue: 0.05
    p_flip: 0.5
    rotation_range:
    - -5
    - 5
    saturation: 0.1
    scale_range:
    - 0.9
    - 1.1
  batch_size: 2
  img_size:
  - 120
  - 160
  num_workers: 4
  sequence_length: 4
  sequence_stride: 2
losses:
  boundary_weight: 0.0
  ce_weight: 1.0
  dice_weight: 2.0
  temporal_weight: 0.5
model:
  d_conv: 4
  d_state: 32
  dropout: 0.15
  expand: 2
  hidden_dims:
  - 64
  - 128
  - 256
  input_dim: 3
  temporal_window: 4
optimizer:
  betas:
  - 0.9
  - 0.95
  lr: 5.0e-07
  type: AdamW
  weight_decay: 0.01
paths:
  checkpoints: checkpoints/stable_binary
  davis_root: /mnt/c/Datasets/DAVIS
  logs: logs/stable_binary
  visualizations: visualizations/stable_binary
scheduler:
  min_lr: 1.0e-08
  type: cosine
training:
  epochs: 50
  grad_clip_value: 0.05
  gradient_accumulation_steps: 4
  mixed_precision: true
  save_every: 5
  validate_every: 2
