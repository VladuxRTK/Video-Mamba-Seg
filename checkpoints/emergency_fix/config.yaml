dataset:
  augmentation:
    brightness: 0.1
    contrast: 0.1
    hue: 0.05
    p_flip: 0.5
    rotation_range:
    - -5
    - 5
    saturation: 0.1
    scale_range:
    - 0.9
    - 1.1
  batch_size: 2
  img_size:
  - 240
  - 320
  num_workers: 4
  sequence_length: 3
  sequence_stride: 2
evaluation:
  enabled: true
  metrics:
  - iou
  - f1
losses:
  boundary_weight: 0.0
  ce_weight: 1.0
  dice_weight: 2.0
  temporal_weight: 0.1
model:
  d_conv: 4
  d_state: 16
  dropout: 0.1
  expand: 2
  hidden_dims:
  - 32
  - 64
  - 128
  input_dim: 3
  temporal_window: 3
optimizer:
  betas:
  - 0.9
  - 0.999
  lr: 0.001
  type: AdamW
  weight_decay: 0.01
paths:
  checkpoints: checkpoints/emergency_fix
  davis_root: /mnt/c/Datasets/DAVIS
  logs: logs/emergency_fix
  visualizations: visualizations/emergency_fix
scheduler:
  gamma: 0.5
  min_lr: 1e-5
  step_size: 15
  type: step
training:
  epochs: 50
  grad_clip_value: 1.0
  gradient_accumulation_steps: 4
  mixed_precision: true
  save_every: 5
  validate_every: 1
visualization:
  dir: visualizations/emergency_fix
  enabled: true
  interval: 2
